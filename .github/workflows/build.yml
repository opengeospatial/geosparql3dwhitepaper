name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Metanorma Whitepaper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fontist/setup-fontist@v2
        with:
          cache: false

      - name: Install Fira Code (all formulas/styles)
        run: |
          fontist update
          fontist install --formula fira_code --accept-all-licenses
          fontist status "Fira Code"

      - uses: actions-mn/setup@main

      - name: Run Metanorma 🔧
        run: |
          pip install --pre bibtexparser
          python scripts/processbibtex.py
          metanorma site generate --agree-to-terms -o site

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          clean: false
          FOLDER: site/
