
name: CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Metanorma Whitepaper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Fontist
        uses: actions/cache@v4
        with:
          path: ~/.fontist
          key: fontist-${{ runner.os }}
          restore-keys: |
            fontist-${{ runner.os }}

      # Install Ruby instead of using the Snap/Tebako runtime
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      # Explicitly use RubyGems installation
      - name: Set up Metanorma
        uses: actions-mn/setup@v3
        with:
          installation-method: gem

      - name: Run Metanorma 🔧
        run: |
          python -m pip install --pre bibtexparser
          python scripts/processbibtex.py
          metanorma site generate --agree-to-terms -o site

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          clean: false
          FOLDER: site/
